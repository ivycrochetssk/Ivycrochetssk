<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 50px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }

    .subtitle {
      color: #777;
      margin-bottom: 40px;
      font-size: 1rem;
    }

    .joke-display {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }

    .joke-text {
      font-size: 1.3rem;
      line-height: 1.6;
      font-weight: 500;
    }

    .joke-setup {
      font-weight: 600;
    }

    .joke-punchline {
      margin-top: 15px;
      font-style: italic;
      opacity: 0.9;
    }

    .loading {
      display: none;
      color: #667eea;
      font-weight: 600;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #667eea;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 32px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      flex: 1;
      min-width: 150px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      flex: 1;
      min-width: 150px;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }

    .btn-secondary:active {
      transform: translateY(0);
    }

    .error {
      color: #d32f2f;
      padding: 15px 20px;
      background: #ffebee;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .joke-category {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: left;
    }

    .joke-category label {
      display: block;
      margin-bottom: 10px;
      color: #333;
      font-weight: 600;
    }

    .category-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 8px 16px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .category-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .category-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .joke-text {
        font-size: 1.1rem;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>😂 Joke Generator</h1>
  <p class="subtitle">Get a random laugh delivered to you!</p>

  <div class="error" id="errorMessage"></div>

  <div class="joke-category">
    <label>Select Category (Optional):</label>
    <div class="category-buttons">
      <button class="category-btn active" data-category="any">Any</button>
      <button class="category-btn" data-category="general">General</button>
      <button class="category-btn" data-category="knock-knock">Knock-Knock</button>
      <button class="category-btn" data-category="programming">Programming</button>
    </div>
  </div>

  <div class="joke-display" id="jokeDisplay">
    <div class="joke-text">Press the button to get a joke! 🎭</div>
  </div>

  <div class="loading" id="loading">
    <span class="spinner"></span>Loading joke...
  </div>

  <div class="button-group">
    <button class="btn-primary" id="generateBtn">Get a Joke</button>
    <button class="btn-secondary" id="shareBtn">Share</button>
  </div>
</div>

<script>
  let currentJoke = null;
  let selectedCategory = 'any';

  const jokeDisplay = document.getElementById('jokeDisplay');
  const generateBtn = document.getElementById('generateBtn');
  const shareBtn = document.getElementById('shareBtn');
  const loading = document.getElementById('loading');
  const errorMessage = document.getElementById('errorMessage');
  const categoryBtns = document.querySelectorAll('.category-btn');

  // Category button listeners
  categoryBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      categoryBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.dataset.category;
    });
  });

  // Fetch joke from API
  async function fetchJoke() {
    loading.classList.add('active');
    errorMessage.classList.remove('show');
    generateBtn.disabled = true;
    shareBtn.disabled = true;

    try {
      let url = 'https://v2.jokeapi.dev/joke/';

      if (selectedCategory === 'any') {
        url += 'Any';
      } else if (selectedCategory === 'knock-knock') {
        url += 'Knock-Knock';
      } else if (selectedCategory === 'programming') {
        url += 'Programming';
      } else if (selectedCategory === 'general') {
        url += 'General';
      }

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error('Failed to fetch joke');
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.message || 'Error fetching joke');
      }

      currentJoke = data;
      displayJoke(data);
    } catch (error) {
      showError('Oops! Could not fetch a joke. Please try again.');
      console.error('Error:', error);
    } finally {
      loading.classList.remove('active');
      generateBtn.disabled = false;
      shareBtn.disabled = false;
    }
  }

  // Display joke
  function displayJoke(joke) {
    if (joke.type === 'twopart') {
      jokeDisplay.innerHTML = `
        <div class="joke-text">
          <div class="joke-setup">${escapeHtml(joke.setup)}</div>
          <div class="joke-punchline">${escapeHtml(joke.delivery)}</div>
        </div>
      `;
    } else if (joke.type === 'single') {
      jokeDisplay.innerHTML = `
        <div class="joke-text">${escapeHtml(joke.joke)}</div>
      `;
    }
  }

  // Show error message
  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.classList.add('show');
    jokeDisplay.innerHTML = '<div class="joke-text">😔 Failed to load joke. Try again!</div>';
  }

  // Escape HTML to prevent XSS
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Share joke
  function shareJoke() {
    if (!currentJoke) {
      alert('Please generate a joke first!');
      return;
    }

    let jokeText = '';
    if (currentJoke.type === 'twopart') {
      jokeText = `${currentJoke.setup}\n\n${currentJoke.delivery}`;
    } else {
      jokeText = currentJoke.joke;
    }

    if (navigator.share) {
      navigator.share({
        title: 'Random Joke',
        text: jokeText,
      }).catch(err => console.log('Error sharing:', err));
    } else {
      // Fallback: copy to clipboard
      navigator.clipboard.writeText(jokeText).then(() => {
        alert('Joke copied to clipboard!');
      }).catch(() => {
        alert('Could not copy to clipboard');
      });
    }
  }

  // Event listeners
  generateBtn.addEventListener('click', fetchJoke);
  shareBtn.addEventListener('click', shareJoke);

  // Load initial joke
  fetchJoke();
</script>

</body>
</html>
